# Minimal CI: the CPU unit tests (config composition, losses, metrics, trends, utils). It cannot run training on a
# GPU or SLURM sweeps -- those stay cluster smoke tests (CLAUDE.md §1). See the Actions tab after a push.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install (CPU torch first so pip does not download CUDA wheels, then the rest)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Test
        run: pytest -k "not slow" -q -o log_cli=false
