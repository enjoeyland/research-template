# path to root directory
# this requires PROJECT_ROOT environment variable to exist
# you can replace it with "." if you want the root to be the current working directory
root_dir: ${oc.env:PROJECT_ROOT}

# path to data directory
# datasets are always read from <repo>/data; heavy ones are symlinked into it (data/README.md)
data_dir: ${paths.root_dir}/data/

# path to logging directory
log_dir: ${paths.root_dir}/logs/

# path to output directory, created dynamically by hydra
# path generation pattern is specified in `configs/hydra/default.yaml`
# use it to store all files generated during the run, like ckpts and metrics
output_dir: ${hydra:runtime.output_dir}

# path to working directory
work_dir: ${hydra:runtime.cwd}

# timestamp; default value of top-level `experiment_name` (see configs/train.yaml)
run_id: ${now:%Y-%m-%d}_${now:%H-%M-%S}

# path to checkpoint directory
# defaults under log_dir, but can be redirected to shared/large storage by setting
# CHECKPOINT_DIR in .env (e.g. CHECKPOINT_DIR=/lustre/<user>/checkpoints/<project>)
# One folder per experiment ; seeds are distinguished in
# checkpoint / artifact filenames (seed${seed}_...), not as subdirectories.
ckpt_dir: ${oc.env:CHECKPOINT_DIR,${paths.log_dir}}/${task_name}/runs/${experiment_name}/checkpoints
