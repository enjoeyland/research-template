# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# One clean folder per experiment (logs/train/runs/<exp>/).
# Seeds share this dir; checkpoint / analyze filenames carry seed${seed}_…
run:
  dir: ${paths.log_dir}/${task_name}/runs/${experiment_name}
sweep:
  dir: ${paths.log_dir}/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}

job_logging:
  handlers:
    file:
      # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
      # Per-seed log file so concurrent seeds in the same experiment dir don't clobber each other.
      filename: ${hydra.runtime.output_dir}/${task_name}_seed${seed}.log
