# @package _global_

# smoke test: a few steps; the whole run tree is isolated under logs/smoke/runs/<experiment>/ (not mixed into real runs).
# Unlike debug=default this keeps callbacks (checkpoints are written) and does NOT force the cpu,
# so it can run on a GPU allocation (see CLAUDE.md §1: run through srun/sbatch).
#   python src/train.py debug=smoke experiment/train=<name> logger=csv trainer=gpu

tags: ["debug"]

extras:
  enforce_tags: False

trainer:
  max_epochs: 1
  limit_train_batches: 20
  limit_val_batches: 5
  limit_test_batches: 5

callbacks:
  early_stopping: null

paths:
  log_dir: ${paths.root_dir}/logs/smoke
  # never into $CHECKPOINT_DIR (long-term storage)
  ckpt_dir: ${paths.log_dir}/runs/${experiment_name}/checkpoints
