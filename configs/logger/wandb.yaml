# https://wandb.ai

wandb:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  # name: "" # name of the run (normally generated by wandb)
  save_dir: "${paths.output_dir}"
  offline: False
  id: null # pass correct id to resume experiment!
  anonymous: null # enable anonymous logging
  # project name: WANDB_PROJECT (.env) > the repo folder name (so a copied template names itself) > override with
  # `logger.wandb.project=<name>` on the command line
  project: ${oc.env:WANDB_PROJECT,${basename:${paths.root_dir}}}
  log_model: False # upload lightning ckpts
  prefix: "" # a string to put at the beginning of metric keys
  entity: ${oc.env:WANDB_ENTITY,null} # your wandb team / user; set WANDB_ENTITY in .env
  group: ""
  tags: []
  job_type: ""
