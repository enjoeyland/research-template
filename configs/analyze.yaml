# @package _global_

# Post-hoc analysis (src/analyze.py). Shares `experiment/train` with train.py/eval.py so that
# `experiment/train=<name>` resolves the same paths.ckpt_dir (= checkpoints of that experiment).

defaults:
  - data: toy
  - model: toy
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - experiment/train: null
  - optional local: default
  - _self_  # last, so the overrides below win

task_name: "analyze"
experiment_name: ${paths.run_id}
tags: ["dev"]
seed: 0

# checkpoints written by train.py are looked up in the *train* run dir, not this analyze run dir
seeds: [0]

paths:
  # checkpoints live in the *train* run dir, not in this analyze run dir
  ckpt_dir: ${oc.env:CHECKPOINT_DIR,${paths.log_dir}}/train/runs/${experiment_name}/checkpoints
