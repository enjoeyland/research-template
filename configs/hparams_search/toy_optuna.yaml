# @package _global_

# example hyperparameter optimization with Optuna (needs `pip install hydra-optuna-sweeper`):
# python src/train.py -m hparams_search=toy_optuna

defaults:
  - override /hydra/sweeper: optuna

# make sure this is the name of a metric logged in the lightning module!
optimized_metric: "val/acc_best"

# docs: https://hydra.cc/docs/next/plugins/optuna_sweeper
hydra:
  mode: "MULTIRUN"

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: null # e.g. 'sqlite:///example.db' to persist results
    study_name: null
    n_jobs: 1
    direction: maximize
    n_trials: 20
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 1234
      n_startup_trials: 10
    params:
      model.optimizer.lr: interval(0.0001, 0.1)
      data.batch_size: choice(32, 64, 128)
      model.hidden_size: choice(16, 32, 64)
